<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b606b"/>
      <stop offset=".55" stop-color="#2c2f35"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".4"/>
      <stop offset="1" stop-color="#000" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#e6dfcc"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset=".5" stop-color="#f5c400"/>
      <stop offset="1" stop-color="#c99a00"/>
    </linearGradient>
    <clipPath id="clip"><rect x="8" y="4" width="44" height="54" rx="5"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- ribbon bookmark hanging from the pages -->
    <path d="M30 56h5v7.5l-2.5-2.2-2.5 2.2z" fill="#e0ad00"/>
    <!-- page block peeking out right and bottom -->
    <rect x="12" y="7" width="44" height="54" rx="4.5" fill="url(#paper)"/>
    <path d="M54 11v46M12.5 59H50" stroke="#cfc6ae" stroke-width=".8" fill="none"/>
    <!-- cover -->
    <rect x="8" y="4" width="44" height="54" rx="5" fill="url(#cover)"/>
    <g clip-path="url(#clip)">
      <rect x="8" y="4" width="8" height="54" fill="url(#spine)"/>
      <path d="M16.2 4v54" stroke="#000" stroke-opacity=".3" stroke-width="1"/>
      <path d="M17.2 4v54" stroke="#fff" stroke-opacity=".14" stroke-width="1"/>
      <rect x="8" y="4" width="44" height="1.2" fill="#fff" fill-opacity=".25"/>
      <!-- faint rim so the graphite cover still reads on dark tab bars -->
      <rect x="8.6" y="4.6" width="42.8" height="52.8" rx="4.4" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.2"/>
      <!-- elastic band -->
      <rect x="43" y="4" width="4.5" height="54" fill="url(#band)"/>
    </g>
    <!-- cover label -->
    <rect x="21" y="15" width="18" height="12" rx="2" fill="#fbf8ef"/>
    <path d="M24.5 19.5h11M24.5 23h7" stroke="#2c2f35" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
